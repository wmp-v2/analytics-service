name: Analytics-Service
on: [push]
jobs:
  docker_build:
    runs-on: self-hosted
    steps:
       - uses: actions/checkout@v6
       - name: Build image
         run: make docker-build

  eks-deploy:
     runs-on: self-hosted
     steps:
     - uses: actions/checkout@v6
     - uses: actions/checkout@v6
       with:
        repository: sh-devops-itrn-2/wmp-helm-v1
        path: helm
     - name: Update kubeconfig
       run: aws eks update-kubeconfig --region us-east-1 --name dev
     - name: Helm Deploy
       run:  make eks-deploy

      
      
